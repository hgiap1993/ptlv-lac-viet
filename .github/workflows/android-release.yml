name: Build Offline Android APK & Publish Release (PTLV Lạc Việt)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Standalone Offline Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21 (Required for Capacitor 6 / Android SDK 34)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Initialize Capacitor Android
        run: |
          rm -f www/*.apk
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          # Copy custom PTLV icon into Android mipmap folders and remove default Capacitor vector overrides
          rm -f android/app/src/main/res/drawable-anydpi-v24/ic_launcher_foreground.xml
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            if [ -d "$dir" ]; then
              cp www/icon-512.png "$dir/ic_launcher.png"
              cp www/icon-512.png "$dir/ic_launcher_round.png"
              cp www/icon-512.png "$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Configure Signed Release Build (versionCode 2, versionName 1.1.0)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > /tmp/ptlv-signing.keystore
          python3 -c '
          import re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          txt = p.read_text(encoding="utf-8")
          txt = re.sub(r"versionCode\s+\d+", "versionCode 2", txt, count=1)
          txt = re.sub(r"versionName\s+\"[^\"]+\"", "versionName \"1.1.0\"", txt, count=1)
          signing_block = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {"""
          assert "    buildTypes {" in txt, "buildTypes block not found"
          txt = txt.replace("    buildTypes {", signing_block, 1)
          txt = re.sub(r"(buildTypes\s*\{[\s\S]*?release\s*\{)", r"\1\n            signingConfig signingConfigs.release", txt, count=1)
          p.write_text(txt, encoding="utf-8")
          '

      - name: Build Signed Release Offline APK
        working-directory: ./android
        env:
          ANDROID_KEYSTORE_PATH: /tmp/ptlv-signing.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../PTLV-LyHocLacViet.apk
          rm -f /tmp/ptlv-signing.keystore
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs ../PTLV-LyHocLacViet.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTLV-LyHocLacViet-APK
          path: PTLV-LyHocLacViet.apk

      - name: Publish Signed Release APK to GitHub Release v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "PTLV Lạc Việt Đạo Quán v1.1.0 - Android APK (Signed Release, Offline 100%)"
          body: "Bản cài đặt Android Release (ký chính chủ signing.keystore, chạy Offline 100%, cập nhật đầy đủ 55 chuyên khảo từ TaiLieuLyHoc.md)."
          files: PTLV-LyHocLacViet.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
